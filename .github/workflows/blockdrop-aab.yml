name: Build Block Drop AAB

on:
  push:
    branches: ["blockdrop-build"]
    paths:
      - "blockdrop/**"
      - ".github/workflows/blockdrop-aab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore Android project
        run: |
          base64 --decode blockdrop/project.zip.b64 > /tmp/blockdrop-project.zip
          mkdir -p /tmp/blockdrop
          unzip -q /tmp/blockdrop-project.zip -d /tmp/blockdrop
          test -f /tmp/blockdrop/BlockDrop-WebView/app/build.gradle.kts

      - name: Set exact Play package name
        run: |
          FILE=/tmp/blockdrop/BlockDrop-WebView/app/build.gradle.kts
          sed -i 's/applicationId = "com.blockdrop.game"/applicationId = "com.blockdrop.tetrisgame"/' "$FILE"
          grep -n 'applicationId' "$FILE"
          grep -q 'applicationId = "com.blockdrop.tetrisgame"' "$FILE"

      - name: Build signed release AAB
        working-directory: /tmp/blockdrop/BlockDrop-WebView
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify AAB
        run: |
          AAB=/tmp/blockdrop/BlockDrop-WebView/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -l "$AAB" | head -40
          ls -lh "$AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockDrop-tetrisgame-release-aab
          path: /tmp/blockdrop/BlockDrop-WebView/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
