name: Build Block Drop AAB

on:
  push:
    branches: ["blockdrop-build"]
    paths:
      - "blockdrop/**"
      - ".github/workflows/blockdrop-aab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Restore Android project
        run: |
          base64 --decode blockdrop/project.zip.b64 > /tmp/blockdrop-project.zip
          mkdir -p /tmp/blockdrop
          unzip -q /tmp/blockdrop-project.zip -d /tmp/blockdrop
          test -f /tmp/blockdrop/BlockDrop-WebView/app/build.gradle.kts

      - name: Apply Play package, version and launcher icon
        run: |
          ROOT=/tmp/blockdrop/BlockDrop-WebView
          FILE="$ROOT/app/build.gradle.kts"
          MANIFEST="$ROOT/app/src/main/AndroidManifest.xml"

          sed -i 's/applicationId = "com.blockdrop.game"/applicationId = "com.blockdrop.tetrisgame"/' "$FILE"
          sed -i 's/versionCode = 1/versionCode = 2/' "$FILE"
          sed -i 's/versionName = "1.0"/versionName = "1.1"/' "$FILE"

          mkdir -p "$ROOT/app/src/main/res/drawable"
          base64 --decode blockdrop/icon144.jpg.b64 > "$ROOT/app/src/main/res/drawable/ic_launcher.jpg"

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/blockdrop/BlockDrop-WebView/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android:icon=' not in s:
              s = s.replace('<application\n', '<application\n        android:icon="@drawable/ic_launcher"\n        android:roundIcon="@drawable/ic_launcher"\n', 1)
          p.write_text(s)
          PY

          grep -n 'applicationId\|versionCode\|versionName' "$FILE"
          grep -n 'android:icon\|android:roundIcon' "$MANIFEST"
          test -s "$ROOT/app/src/main/res/drawable/ic_launcher.jpg"

      - name: Build signed release AAB
        working-directory: /tmp/blockdrop/BlockDrop-WebView
        run: gradle --no-daemon :app:bundleRelease

      - name: Verify AAB
        run: |
          AAB=/tmp/blockdrop/BlockDrop-WebView/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          unzip -l "$AAB" | grep -E 'ic_launcher|base/manifest/AndroidManifest.xml' | head -20 || true
          ls -lh "$AAB"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlockDrop-v1.1-icon-release-aab
          path: /tmp/blockdrop/BlockDrop-WebView/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
