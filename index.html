<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AutoAnonym – Frontend-Prototyp für anonyme Kfz-Aufträge und Gutachten">
  <title>AutoAnonym – Plattform-Prototyp</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#hauptinhalt">Zum Hauptinhalt</a>
  <header class="app-header">
    <div class="header-inner">
      <button class="brand" type="button" data-portal-home aria-label="AutoAnonym Portalstartseite">
        <span class="brand-mark" aria-hidden="true"><span>AA</span></span>
        <span><strong>AutoAnonym</strong><small id="portal-role-label">Kundenportal</small></span>
      </button>
      <div class="header-actions">
        <button class="demo-mode-button" id="demo-mode-button" type="button" aria-controls="demo-panel" aria-expanded="false"><span class="icon icon-code" aria-hidden="true"></span><span>Demo-Modus</span></button>
        <button class="icon-button" id="notifications-button" type="button" aria-label="Benachrichtigungen anzeigen">
          <span class="icon icon-bell" aria-hidden="true"></span><span class="counter" id="notification-count">0</span>
        </button>
      </div>
    </div>
    <section class="demo-panel" id="demo-panel" hidden aria-labelledby="demo-title">
      <div><strong id="demo-title">Demo- und Entwicklermodus</strong><small>Nur zur Vorschau: Portalrolle wechseln</small></div>
      <div class="demo-role-switcher" role="group" aria-label="Demo-Rolle auswählen">
        <button type="button" data-role-target="KUNDE">Kunde</button><button type="button" data-role-target="WERKSTATT">Werkstatt</button><button type="button" data-role-target="GUTACHTER">Gutachter</button><button type="button" data-role-target="KUNDENSUPPORT">Kundensupport</button><button type="button" data-role-target="ADMIN">Admin</button>
      </div>
    </section>
  </header>

  <main id="hauptinhalt" class="page-shell" tabindex="-1">
    <div id="view-kunde" class="role-view"></div>
    <div id="view-werkstatt" class="role-view" hidden></div>
    <div id="view-gutachter" class="role-view" hidden></div>
    <div id="view-kundensupport" class="role-view" hidden></div>
    <div id="view-admin" class="role-view" hidden></div>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
  <aside class="drawer" id="notifications-drawer" aria-labelledby="notifications-title" aria-hidden="true">
    <div class="drawer-header">
      <div><p class="eyebrow">Aktuelles</p><h2 id="notifications-title">Benachrichtigungen</h2></div>
      <button class="icon-button" id="notifications-close" type="button" aria-label="Benachrichtigungen schließen">×</button>
    </div>
    <div id="notifications-list" class="stack"></div>
    <button class="button button-secondary button-block" id="notifications-read" type="button">Alle als gelesen markieren</button>
  </aside>

  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header"><h2 id="modal-title">Dialog</h2><button class="icon-button" id="modal-close" type="button" aria-label="Dialog schließen">×</button></div>
      <div id="modal-content"></div>
    </section>
  </div>
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

  <script src="js/benachrichtigungen.js" defer></script>
  <script src="js/status.js" defer></script>
  <script src="js/navigation.js" defer></script>
  <script src="js/dialoge.js" defer></script>
  <script src="js/nachrichten.js" defer></script>
  <script src="js/kunde.js" defer></script>
  <script src="js/werkstatt.js" defer></script>
  <script src="js/gutachter.js" defer></script>
  <script src="js/support.js" defer></script>
  <script src="js/admin.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
